kotlin.version=1.9.22
# Kotlin Gradle plugin, deliberately separate from the runtime `kotlin.version` above: Gradle 9 needs
# a newer plugin than that runtime, and bumping the plugin must not change the kotlin-stdlib the
# published modules depend on and the server runs on.
kotlin-plugin.version=2.1.21
spring-boot.version=3.2.2
# Spring Boot Gradle plugin, separate from the Spring Boot BOM above for the same reason as
# kotlin-plugin.version: Gradle 9 needs a newer plugin, the service keeps its Spring Boot runtime.
spring-boot-plugin.version=3.2.12
spring-cloud.version=2023.0.0
openfeign.version=13.1
springdoc-openapi.version=2.3.0
bmuschko-docker-plugin.version=9.4.0
docker-compose-plugin.version=0.17.21
# The build-chain library; published to GitHub Packages (octopusden/octopus-maven-packages) only.
octopus-teamcity-automation.version=1.2.0
# The TeamCity and Components Registry clients the library is built against, used directly by the
# server to build them per request and by ft to prepare TeamCity.
teamcity-client.version=2.0.92
octopus-components-registry-service-client.version=3.0.14
octopus-components-registry.version=3.0.4
mockito-kotlin.version=5.4.0
octopus-oc-template.version=2.0.8
# Keep detekt pinned: 1.23.8 has Kotlin compatibility issues with the 1.9 language level.
detekt.version=1.23.5
ktlint-gradle.version=14.0.1
kover.version=0.9.4
owasp-dependency-check.version=12.2.0
octopus-quality.version=3.0.0
sonarqube.version=7.5.0.8588
jakarta-validation.version=3.1.1

coverage.line.min=80
coverage.branch.min=50

teamcity-2022.image-tag=2022.04.7
teamcity-2026.image-tag=2026.1

test.platform=docker
docker.registry=docker.io
octopus.github.docker.registry=ghcr.io
okd.active-deadline-seconds=1800
okd.project=
okd.cluster-domain=
okd.web-console-url=
okd.service-account-anyuid=teamcity
