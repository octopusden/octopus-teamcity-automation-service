name: Sonar

on:
  push:
    branches: [ '**' ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    # The build resolves octopus-teamcity-automation-core from GitHub Packages, so it opts in to the
    # read credentials octopus-base exports (resolve-from-shared-packages, since v3.3.0).
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-sonar.yml@v3.3.0
    with:
      resolve-from-shared-packages: true
      java-version: '21'
      quality-gate-wait: true
    secrets: inherit
